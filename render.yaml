services:
  - type: web
    name: nexus-ai-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: python -m pip install --upgrade pip setuptools wheel && python -m pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: NEXUS_DB_PATH
        value: /tmp/nexus.db
      - key: NEXUS_ALLOWED_ORIGINS
        value: https://jasonbinong.github.io,http://127.0.0.1:8070,http://localhost:8070
